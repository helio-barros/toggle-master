# gitops/monitoring/applications.yaml
# 3 Applications do ArgoCD pra stack de observabilidade.
# Usa multi-source: um source puxa o chart Helm, outro puxa os values do nosso git repo.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 93.1.2
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/gitops/monitoring/kube-prometheus-stack-values.yaml
    - repoURL: https://github.com/helio-barros/toggle-master.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
---
