# gitops/monitoring/alertmanager-config.yaml
# Rotea alertas com severity=critical para o PagerDuty via Events API v2.
# A integration-key vem do Secret pagerduty-secrets (criado na Fase 4).
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: togglemaster-routing
  namespace: monitoring
  labels:
    alertmanagerConfig: togglemaster
spec:
  route:
    receiver: pagerduty-critical
    # Matcher na raiz: so captura alertas do time togglemaster (nossas PrometheusRules
    # tem label team=togglemaster). Impede que alertas built-in (Watchdog, KubeCPUOvercommit,
    # KubeMemoryOvercommit, etc.) caiam aqui.
    matchers:
      - name: team
        value: togglemaster
        matchType: =
    groupBy: ['alertname', 'job']
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 1h
    routes:
      # Sub-rota: alertas PodDown tambem vao pro selfheal-webhook (restart automatico).
      # `continue: true` deixa o alerta prosseguir para a rota default (pagerduty-critical)
      # na mesma passada, entao o PodDown notifica o humano E dispara o rollout restart.
      - receiver: selfheal-webhook
        matchers:
          - name: alertname
            value: PodDown
            matchType: =
        continue: true
        groupWait: 10s       # self-heal mais rapido que notificacao humana
        groupInterval: 5m
        repeatInterval: 15m
  receivers:
    - name: pagerduty-critical
      pagerdutyConfigs:
        - sendResolved: true
          routingKey:
            name: pagerduty-secrets
            key: integration-key
          description: '[{{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}'
          severity: '{{ if eq .Status "firing" }}critical{{ else }}info{{ end }}'
          details:
            - key: namespace
              value: '{{ .CommonLabels.namespace }}'
            - key: job
              value: '{{ .CommonLabels.job }}'
            - key: alertname
              value: '{{ .CommonLabels.alertname }}'
            - key: description
              value: '{{ .CommonAnnotations.description }}'
    - name: selfheal-webhook
      webhookConfigs:
        - url: http://selfheal-webhook.monitoring.svc.cluster.local:8080/webhook
          sendResolved: false  # resolve nao reverte restart
