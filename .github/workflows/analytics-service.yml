name: analytics-service CI
on:
  push:
    branches: [main]
    paths:
      - "analytics-service/**"
      - ".github/workflows/analytics-service.yml"
      - ".github/workflows/_service-ci.yml"
  pull_request:
    paths:
      - "analytics-service/**"
jobs:
  ci:
    permissions:
      contents: write
    uses: ./.github/workflows/_service-ci.yml
    with:
      service_name: analytics-service
      language: python
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
