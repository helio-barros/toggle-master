services:

  # ════════════════════════════════════════════════════════════
  # INFRAESTRUTURA
  # ════════════════════════════════════════════════════════════

  postgres-auth:
    image: postgres:14-alpine
    container_name: postgres-auth
    restart: unless-stopped
    environment:
      POSTGRES_USER: master
      POSTGRES_PASSWORD: master
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
      - ./auth-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U master -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-flags:
    image: postgres:14-alpine
    container_name: postgres-flags
    restart: unless-stopped
    environment:
      POSTGRES_USER: master
      POSTGRES_PASSWORD: master
      POSTGRES_DB: flags_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_flags_data:/var/lib/postgresql/data
      - ./flag-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U master -d flags_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-targeting:
    image: postgres:14-alpine
    container_name: postgres-targeting
    restart: unless-stopped
    environment:
      POSTGRES_USER: master
      POSTGRES_PASSWORD: master
      POSTGRES_DB: targeting_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_targeting_data:/var/lib/postgresql/data
      - ./targeting-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U master -d targeting_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis-evaluation
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ════════════════════════════════════════════════════════════
  # MICROSERVICES
  # ════════════════════════════════════════════════════════════

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgres://master:master@postgres-auth:5432/auth_db
      PORT: 8001
      MASTER_KEY: ${MASTER_KEY:-admin-secreto-123}
    depends_on:
      postgres-auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  flag-service:
    build:
      context: ./flag-service
      dockerfile: Dockerfile
    container_name: flag-service
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgres://master:master@postgres-flags:5432/flags_db
      AUTH_SERVICE_URL: http://auth-service:8001
      PORT: 8002
    depends_on:
      postgres-flags:
        condition: service_healthy
      auth-service:
        condition: service_healthy

  targeting-service:
    build:
      context: ./targeting-service
      dockerfile: Dockerfile
    container_name: targeting-service
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: postgres://master:master@postgres-targeting:5432/targeting_db
      AUTH_SERVICE_URL: http://auth-service:8001
      PORT: 8003
    depends_on:
      postgres-targeting:
        condition: service_healthy
      auth-service:
        condition: service_healthy

  evaluation-service:
    build:
      context: ./evaluation-service
      dockerfile: Dockerfile
    container_name: evaluation-service
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      PORT: 8004
      REDIS_URL: redis://redis:6379
      FLAG_SERVICE_URL: http://flag-service:8002
      TARGETING_SERVICE_URL: http://targeting-service:8003
      SERVICE_API_KEY: ${SERVICE_API_KEY:-}
      AWS_SQS_URL: ${AWS_SQS_URL:-}
      AWS_REGION: ${AWS_REGION:-us-east-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
      flag-service:
        condition: service_started
      targeting-service:
        condition: service_started

  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    container_name: analytics-service
    restart: unless-stopped
    ports:
      - "8005:8005"
    environment:
      PORT: 8005
      AWS_SQS_URL: ${AWS_SQS_URL:-}
      AWS_DYNAMODB_TABLE: ${AWS_DYNAMODB_TABLE:-ToggleMasterAnalytics}
      AWS_REGION: ${AWS_REGION:-us-east-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

volumes:
  postgres_auth_data:
  postgres_flags_data:
  postgres_targeting_data:
